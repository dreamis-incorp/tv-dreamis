<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TV Dreamis</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,400..700&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Marca Dreamis: azul-marinho #002a3a, laranja #f15a22, azul claro #7bafde. Palco vertical fixo 1080x1920, escalado para a TV. */
:root{
  --navy:#002a3a; --navy2:#073a4e; --navy3:#0d4a63; --line:rgba(255,255,255,.12);
  --orange:#f15a22; --sky:#7bafde; --white:#ffffff; --mute:#9fbccd; --soft:#cfe2f4;
  --ok:#7bafde; --run:#e9f2f8; --late:#f15a22; --wait:#5f8396;
  --title:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wide:"Archivo","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy);overflow:hidden;color:var(--white);font-family:var(--title)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:var(--navy);display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}
.wide{font-family:var(--wide);font-stretch:125%;text-transform:uppercase;letter-spacing:.08em}

/* cabecalho */
header{height:112px;display:flex;align-items:center;padding:0 40px;gap:24px;border-bottom:1px solid var(--line);flex:none}
header img{height:56px;display:block}
.crumb{flex:1;display:flex;flex-direction:column;gap:6px}
.crumb .sector{font-size:24px;color:var(--orange);font-weight:700}
.crumb .slide{font-size:30px;font-weight:700;letter-spacing:-.01em}
.clock{text-align:right}
.clock b{font-size:40px;font-weight:700;display:block;line-height:1}
.clock span{font-size:16px;color:var(--mute)}
.ribbon{background:var(--orange);color:#fff;font-size:15px;font-weight:800;padding:8px 18px;border-radius:999px;letter-spacing:.06em;white-space:nowrap}

/* corpo */
main{flex:1;position:relative}
.slide-box{position:absolute;inset:28px 40px 24px;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
.slide-box.on{opacity:1;transform:none}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:28px;padding:36px 40px;position:relative}
.card h2{font-size:26px;font-weight:700;color:var(--soft);margin-bottom:6px}
.card .sub{font-size:22px;color:var(--mute);margin-bottom:22px}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;height:100%}
.vc{display:flex;flex-direction:column}
.vc .fill{flex:1;display:flex;flex-direction:column;justify-content:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:28px;height:100%}
.grid3.leg{height:calc(100% - 52px)}
.legend{font-size:21px;color:var(--mute);margin-top:18px}
.legend em{display:inline-block;width:4px;height:20px;background:#fff;border-radius:2px;vertical-align:-4px;margin:0 8px 0 0}
.legend b{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid var(--mute);vertical-align:-1px;margin:0 8px 0 24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.big{display:flex;align-items:baseline;gap:20px;margin:6px 0 26px}
.big b{font-size:230px;line-height:.9;font-weight:900;letter-spacing:-.04em}
.big span{font-size:56px;color:var(--mute);font-weight:600}
.mid{font-size:104px;font-weight:900;letter-spacing:-.03em;line-height:1}
.mid small{font-size:34px;font-weight:600;color:var(--mute);margin-left:12px;letter-spacing:0}

/* barras de progresso */
.track{height:30px;border-radius:999px;background:rgba(255,255,255,.1);position:relative}
.track.lg{height:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;min-width:12px}
.track i.ok{background:var(--ok)} .track i.run{background:var(--run)} .track i.late{background:var(--late)} .track i.wait{background:var(--wait)}
.track em{position:absolute;top:-8px;bottom:-8px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 0 3px var(--navy2)}
.track b.mk{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--navy);border:3px solid var(--mute)}
.chip{display:inline-flex;align-self:flex-start;white-space:nowrap;align-items:center;gap:10px;font-size:26px;font-weight:700;padding:10px 22px;border-radius:999px;margin-top:22px}
.chip.ok{background:var(--ok);color:var(--navy)} .chip.run{background:var(--run);color:var(--navy)}
.chip.late{background:var(--late);color:#fff} .chip.wait{background:rgba(255,255,255,.14);color:var(--soft)}
.note{font-size:24px;color:var(--mute);margin-top:18px;line-height:1.35}
.lab{font-size:28px;font-weight:700;margin-bottom:4px}

/* grafico de semanas */
.bars{display:flex;align-items:flex-end;gap:22px;height:560px;position:relative;margin-top:12px;padding-bottom:42px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bars .col i{width:100%;border-radius:14px 14px 4px 4px;display:block;min-height:8px}
.bars .col i.ok{background:var(--ok)} .bars .col i.run{background:var(--run)} .bars .col i.late{background:var(--wait)}
.bars .col b{font-size:30px;margin-bottom:8px}
.bars .col span{position:absolute;bottom:-40px;font-size:20px;color:var(--mute)}
.goal{position:absolute;left:0;right:0;border-top:3px dashed var(--mute)}
.goal span{position:absolute;right:0;top:-32px;font-size:20px;color:var(--mute)}

/* funil */
.fun{display:grid;grid-template-columns:260px 1fr 70px;align-items:center;gap:16px;margin:12px 0;font-size:24px}
.fun .bar{height:34px;border-radius:999px;background:rgba(255,255,255,.08);position:relative}
.fun .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--sky);min-width:6px}
.fun .bar i.end{background:var(--wait)}
.fun b{font-size:30px;text-align:right}
.stat .v{font-size:84px;font-weight:900;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:23px;color:var(--mute);margin-top:10px;line-height:1.3}
.cmid .stat{display:flex;flex-direction:column;justify-content:center}
.cmid .stat .v{font-size:110px}
.grid4.xl .stat{display:flex;flex-direction:column;justify-content:center}
.grid4.xl .stat .v{font-size:150px}
.grid4.xl .stat .delta{font-size:26px}
.delta{font-size:24px;font-weight:700;margin-top:14px}
.delta.up{color:var(--sky)} .delta.down{color:var(--soft)} .delta.eq{color:var(--mute)}

/* conquistas */
.ach{display:flex;align-items:center;gap:20px;font-size:30px;padding:16px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .ic{width:56px;height:56px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-size:32px;font-weight:900;flex:none}

/* rodape */
footer{height:76px;flex:none;display:flex;align-items:center;gap:20px;padding:0 40px;border-top:1px solid var(--line);position:relative}
footer .dots{display:flex;gap:14px;align-items:center;flex:1}
footer .grp{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--wait);margin-right:26px}
footer .grp.on{color:#fff}
footer .dot{width:12px;height:12px;border-radius:50%;background:var(--wait);display:inline-block}
footer .dot.on{background:var(--orange)}
footer .tag{font-size:15px;color:var(--mute)}
#prog{position:absolute;left:0;top:-3px;height:3px;background:var(--orange);width:0}

/* tela de senha */
#gate{position:fixed;inset:0;z-index:50;background:var(--navy);display:grid;place-items:center}
#gate form{background:#fff;color:var(--navy);border-radius:18px;padding:36px;width:min(440px,90vw);display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#gate b{font-size:24px} #gate span.h{font-size:15px;color:#4a6470}
#gate input[type=password]{font:inherit;font-size:18px;padding:12px 14px;border:1px solid #b9c7cd;border-radius:8px}
#gate label{font-size:15px;display:flex;gap:8px;align-items:center}
#gate button{font:inherit;font-weight:700;font-size:18px;padding:12px;border:0;border-radius:8px;background:var(--orange);color:#fff;cursor:pointer}
#gerr{font-size:15px;color:#c0392b;min-height:1em}
#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;font-size:36px;color:var(--mute)}

/* layout vertical */
.col-v{display:flex;flex-direction:column;gap:18px;height:100%}
.sechead{font-size:26px;font-weight:700;color:var(--soft);letter-spacing:.02em;margin-top:6px}
.card{padding:26px 30px;border-radius:24px}
.card h2{font-size:26px}
.weekc{display:flex;gap:28px;flex:none;height:410px}
.weekc .wl{flex:1.1}.weekc .wr{flex:1;display:flex;flex-direction:column}
.weekc .big{margin:0 0 14px}.weekc .big b{font-size:150px}.weekc .big span{font-size:40px}
.weekc .sub{font-size:19px;margin-bottom:10px}
.weekc .chip{font-size:22px;margin-top:16px}.weekc .note{font-size:19px;margin-top:12px}
.weekc .bars{height:auto;flex:1;gap:12px;margin-top:6px}
.weekc .bars .col b{font-size:22px}.weekc .bars .col span{font-size:15px;bottom:-34px}
.weekc .goal span{font-size:15px;top:-24px}
.g2m{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,auto);gap:16px}
.card.mk{padding:20px 26px}
.card.mk .lab{font-size:23px}.card.mk .mid{font-size:68px}.card.mk .mid small{font-size:24px}
.card.mk .track.lg{height:30px}.card.mk .chip{font-size:19px;margin-top:14px;padding:8px 16px}
.legend{font-size:17px;margin-top:2px}
.grid4.s4{grid-template-columns:repeat(4,1fr);gap:14px}
.stat.sm{padding:18px 20px}.stat.sm .v{font-size:60px}.stat.sm .l{font-size:17px;margin-top:6px}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g2f .card h2{margin-bottom:12px}
.g2f .fun{grid-template-columns:150px 1fr 44px;gap:10px;margin:9px 0;font-size:18px}
.g2f .fun .bar{height:24px}.g2f .fun b{font-size:22px}
.conq{display:flex;justify-content:space-between;font-size:20px;color:var(--mute);padding:4px 4px 0;margin-top:auto}
.conq b{color:#fff;font-size:24px}
.g2k{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card.kp{padding:26px 30px}.card.kp .v{font-size:110px}.card.kp .delta{font-size:22px}

.col-v.com{gap:30px}.col-v.com .g2k,.col-v.com .g2f{gap:24px}
.col-v.com .card.kp{padding:34px 34px}.col-v.com .card.kp .v{font-size:130px}
.col-v.com .stat.sm{padding:28px 30px}.col-v.com .stat.sm .v{font-size:80px}.col-v.com .stat.sm .l{font-size:20px}
.col-v.com .g2f .card h2{font-size:30px}
.col-v:not(.com){gap:12px}
.weekc{height:345px;padding:20px 28px}.weekc .big b{font-size:120px}.weekc .big{margin-bottom:8px}.weekc .chip{margin-top:10px}.weekc .note{margin-top:8px}
.g2m{gap:12px}.card.mk{padding:14px 24px}.card.mk .mid{font-size:54px}.card.mk .track.lg{height:24px}
.card.mk .chip{margin-top:10px;font-size:18px;padding:6px 14px}.card.mk div[style]{margin:10px 0 2px!important}
.stat.sm{padding:12px 18px}.stat.sm .v{font-size:48px}.stat.sm .l{font-size:16px;margin-top:2px}
.g2f .fun{grid-template-columns:190px 1fr 40px;margin:5px 0;font-size:17px}.g2f .fun .bar{height:20px}
.col-v:not(.com) .g2f .card{padding:18px 24px}.col-v:not(.com) .g2f .card h2{font-size:22px;margin-bottom:6px}
.sechead{font-size:23px;margin-top:2px}
</style>
</head>
<body>
<div id="gate">
  <form id="gf">
    <b>TV Dreamis</b><span class="h">Acesso restrito. Digite a senha.</span>
    <input type="text" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
    <input id="gp" type="password" autocomplete="current-password" aria-label="Senha">
    <label><input id="gr" type="checkbox" checked>Lembrar neste aparelho</label>
    <button>Entrar</button><span id="gerr" role="status"></span>
  </form>
</div>

<div id="stage" hidden>
  <header>
    <img src="assets/logo-mono.png" alt="Dreamis">
    <div class="crumb"><span class="sector wide" id="h-sector"></span><span class="slide" id="h-slide"></span></div>
    <div class="ribbon" id="ribbon" hidden>DADOS DE EXEMPLO</div>
    <div class="clock"><b class="num" id="h-clock">--:--</b><span id="h-upd"></span></div>
  </header>
    <main id="main"><div id="empty">Aguardando os primeiros dados…</div></main>
  <footer><div id="prog"></div><div class="dots" id="dots"></div><div class="tag">Por um mundo encantador</div></footer>
</div>

<script>
const SLIDE_MS = 25000, REFRESH_MS = 5*60*1000;
const nf = n => Number(n).toLocaleString('pt-BR');
const br = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => Math.max(0, Math.min(100, v*100));
const ICON = {ok:'✓ ', run:'', late:'', wait:''};
let DATA = null, order = [], cur = -1, timer = null, paused = false;

/* ---------- componentes ---------- */
function track(feito, meta, st, esp, marks, lg){
  const m = (marks||[]).map(v=>`<b class="mk" style="left:${pct(v/meta)}%"></b>`).join('');
  const e = esp!=null ? `<em style="left:${pct(Math.min(esp,meta)/meta)}%"></em>` : '';
  return `<div class="track ${lg?'lg':''}"><i class="${st}" style="width:${pct(feito/meta)}%"></i>${m}${e}</div>`;
}
const chip = (st, t) => `<span class="chip ${st}">${ICON[st]||''}${esc(t)}</span>`;
function deltaHtml(v, ant){
  if(!ant) return `<div class="delta eq">sem base de comparação</div>`;
  const d = Math.round((v-ant)/ant*100);
  if(d===0) return `<div class="delta eq">= igual ao mês anterior</div>`;
  return `<div class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d)}% vs mês anterior</div>`;
}

/* ---------- slides ---------- */
const SLIDES = [
 {id:'nn', sector:'Novos Negócios', title:'Aquisição de terrenos', ex:d=>false, ok:d=>d.novos_negocios,
  html(d){
    const n=d.novos_negocios, s=n.semana, st=s.status, r=n.recordes, e=n.entrada;
    /* meta da semana */
    let left;
    if(!s.ativa){
      left = `<div class="big"><b style="font-size:64px;line-height:1.1">A abordagem começa em ${br(s.comeca_em)}</b></div><div class="note">Meta: ${s.meta} proprietários por semana com pré-proposta enviada.</div>`;
    } else {
      const falta = Math.max(0, s.meta - s.feitas);
      const msg = st==='ok' ? 'Meta da semana batida!' : st==='run' ? 'Dá para bater' : 'Hora de acelerar';
      left = `<div class="big num"><b>${s.feitas}</b><span>de ${s.meta}</span></div>${track(s.feitas, s.meta, st, null, null, true)}${chip(st, msg)}
        <div class="note">${falta? `Faltam ${falta} · ${s.uteis} ${s.uteis===1?'dia útil':'dias úteis'} até sexta.` : 'Semana fechada. O que vier a mais adianta o acumulado.'}</div>`;
    }
    const max = Math.max(s.meta, ...n.semanas.map(w=>w.n), 1);
    const cols = n.semanas.map(w=>{ const cls = w.n>=s.meta ? 'ok' : (w.inicio===s.inicio ? 'run' : 'late');
      return `<div class="col"><b class="num">${w.n}</b><i class="${cls}" style="height:${pct(w.n/max)*0.82}%"></i><span>${br(w.inicio)}</span></div>`; }).join('');
    const goalY = pct(s.meta/max)*0.82;
    const week = `<section class="card weekc"><div class="wl vc"><h2>Meta da semana</h2><div class="sub">Proprietários abordados com pré-proposta</div><div class="fill">${left}</div></div>
      <div class="wr"><div class="sub" style="margin-bottom:0">Semana a semana</div><div class="bars">${cols}<div class="goal" style="bottom:calc(42px + ${goalY/100} * (100% - 42px))"><span>meta ${s.meta}</span></div></div></div></section>`;
    /* marcos */
    const cards = n.marcos.map(m=>`<section class="card mk"><div class="lab">${esc(m.rotulo)}</div>
        <div class="mid num">${nf(m.feito)}<small>de ${nf(m.meta_final)}</small></div>
        <div style="margin:18px 0 4px">${track(m.feito, m.meta_final, m.status, m.esperado, m.pontos.map(p=>p.meta), true)}</div>${chip(m.status, m.msg)}</section>`).join('');
    const marcos = `<div class="sechead">Rumo ao próximo terreno</div><div class="g2m">${cards}</div>
      <div class="legend"><em></em>onde deveríamos estar hoje<b></b>metas intermediárias do plano</div>`;
    /* pipeline */
    const stat=(v,l)=>`<section class="card stat sm"><div class="v num">${nf(v)}</div><div class="l">${l}</div></section>`;
    const fun=(arr,endIdx)=>{ const mx=Math.max(1,...arr.map(x=>x.n)); return arr.map((x,i)=>`<div class="fun"><span>${esc(x.fase)}</span><div class="bar"><i class="${i>=endIdx?'end':''}" style="width:${pct(x.n/mx)}%"></i></div><b class="num">${x.n}</b></div>`).join(''); };
    const pipe = `<div class="sechead">Pipeline de terrenos</div><div class="grid4 s4">
        ${stat(e.pq_7d+e.crm_7d,'novos nos últimos 7 dias')}${stat(e.pq_30d+e.crm_30d,'novos nos últimos 30 dias')}${stat(n.em_andamento.pq+n.em_andamento.crm,'em andamento')}${stat(n.parados_pq,'pedindo ação para seguir')}</div>
      <div class="g2f"><section class="card"><h2>Pré-qualificação</h2>${fun(n.funil_pq,4)}</section><section class="card"><h2>CRM de terrenos</h2>${fun(n.funil_crm,5)}</section></div>`;
    const conq = `<div class="conq"><span>🏆 Recorde: <b class="num">${r.melhor_semana}</b> em uma semana</span><span>Semanas com meta batida: <b class="num">${r.semanas_batidas}</b></span><span>Sequência: <b class="num">${r.sequencia}</b></span></div>`;
    return `<div class="col-v">${week}${marcos}${pipe}${conq}</div>`;
  }},
 {id:'com', sector:'Comercial', title:'Resultado do mês', ex:d=>d.comercial&&d.comercial.exemplo, ok:d=>d.comercial,
  html(d){
    const c=d.comercial, k=c.kpis, mc=c.meta_conjunta;
    const card=(l,o)=>`<section class="card stat kp"><div class="l" style="margin:0 0 10px;font-size:28px;color:var(--soft);font-weight:700">${l}</div><div class="v num">${nf(o.v)}</div>${deltaHtml(o.v,o.ant)}</section>`;
    const conj=(kk,l)=>{ const o=mc[kk]; const st=o.feito>=o.meta?'ok':'run'; return `<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:28px;margin-bottom:12px"><span class="lab" style="margin:0">${l}</span><b class="num">${o.feito} de ${o.meta}</b></div>${track(o.feito,o.meta,st,null,null,true)}</div>`; };
    const rows=(f)=>[['cadastros','Cadastros'],['agendados','Agendados'],['visitas','Visitas'],['vendas','Vendas']].map(([kk,l])=>{
      const v=f[kk], m=f.meta[kk], st=v>=m?'ok':'run';
      return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:24px;margin-bottom:8px"><span>${l}</span><b class="num">${v} de ${m}</b></div>${track(v,m,st)}</div>`; }).join('');
    return `<div class="col-v com">
      <div class="sechead">${esc(c.mes)} · parcial até ${esc(c.parcial_ate)}</div>
      <div class="g2k">${card('Cadastros',k.cadastros)}${card('Atendimentos agendados',k.agendados)}${card('Visitas',k.visitas)}${card('Vendas',k.vendas)}</div>
      <div class="g2f"><section class="card stat sm"><div class="v num">${String(c.comparecimento).replace('.',',')}%</div><div class="l">dos atendimentos agendados foram realizados (90 dias)</div></section>
        <section class="card stat sm"><div class="v num">${String(c.qualificacao).replace('.',',')}%</div><div class="l">dos cadastros do mês com tipologia preenchida</div></section></div>
      <section class="card"><h2>Meta conjunta do mês</h2><div class="sub" style="margin-bottom:14px">House e Plataforma somando</div><div style="display:flex;gap:44px">${conj('visitas','Visitas')}${conj('vendas','Vendas')}</div></section>
      <div class="g2f"><section class="card"><h2>House</h2>${rows(c.frentes.house)}</section><section class="card"><h2>Plataforma</h2>${rows(c.frentes.plataforma)}</section></div>
      <div class="note" style="margin:0;font-size:20px">Comparação com o mês anterior no mesmo número de dias.</div></div>`;
  }},
];

/* ---------- palco ---------- */
const GIRO = parseInt(new URLSearchParams(location.search).get('giro'))||0;
function fit(){ const w=GIRO?innerHeight:innerWidth, h=GIRO?innerWidth:innerHeight; const s=Math.min(w/1080, h/1920); document.getElementById('stage').style.transform=`translate(-50%,-50%) ${GIRO?`rotate(${GIRO}deg) `:''}scale(${s})`; }
addEventListener('resize', fit);

function build(){
  const main=document.getElementById('main'); main.querySelectorAll('.slide-box').forEach(x=>x.remove());
  order = SLIDES.filter(s=>{ try{ return s.ok(DATA); }catch(e){ return false; } });
  document.getElementById('empty').style.display = order.length ? 'none' : 'grid';
  order.forEach((s,i)=>{ const b=document.createElement('div'); b.className='slide-box'; b.id='sb'+i; b.innerHTML=s.html(DATA); main.appendChild(b); });
  const secs=[...new Set(order.map(s=>s.sector))];
  document.getElementById('dots').innerHTML = secs.map(sc=>`<span class="grp" data-s="${esc(sc)}">${esc(sc)} ${order.map((s,i)=>s.sector===sc?`<span class="dot" id="dt${i}"></span>`:'').join('')}</span>`).join('');
  const g=DATA.gerado_em||''; document.getElementById('h-upd').textContent = g ? 'Atualizado às '+g.slice(11,16)+' de '+br(g.slice(0,10)) : '';
}
function show(i){
  if(!order.length) return;
  cur=(i+order.length)%order.length;
  order.forEach((s,k)=>{ document.getElementById('sb'+k).classList.toggle('on',k===cur); document.getElementById('dt'+k).classList.toggle('on',k===cur); });
  document.querySelectorAll('#dots .grp').forEach(g=>g.classList.toggle('on', g.dataset.s===order[cur].sector));
  const s=order[cur];
  document.getElementById('h-sector').textContent=s.sector; document.getElementById('h-slide').textContent=s.title;
  let ex=false; try{ ex = !!(s.ex(DATA)); }catch(e){}
  document.getElementById('ribbon').hidden = !ex;
  const p=document.getElementById('prog'); p.style.transition='none'; p.style.width='0'; void p.offsetWidth; p.style.transition=`width ${SLIDE_MS}ms linear`; p.style.width='100%';
  clearTimeout(timer); if(!paused) timer=setTimeout(()=>show(cur+1), SLIDE_MS);
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') show(cur+1); else if(e.key==='ArrowLeft') show(cur-1);
  else if(e.key===' '){ paused=!paused; show(cur); }
});
setInterval(()=>{ const d=new Date(); document.getElementById('h-clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); },1000);

/* ---------- dados cifrados ---------- */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
let KEY = null, SKEY = null;
async function deriveKey(pw, P){ const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt']); }
async function decrypt(P, key){ const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.v)},key,b64(P.c)); return JSON.parse(new TextDecoder().decode(t)); }
async function fetchPayload(){ const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('sem dados'); return r.json(); }
function start(){ document.getElementById('gate').remove(); const st=document.getElementById('stage'); st.hidden=false; fit(); build(); show(Math.max(cur,0)); setInterval(refresh, REFRESH_MS); }
async function refresh(){ try{ const P=await fetchPayload(); DATA=await decrypt(P,KEY); const keep=cur; build(); show(Math.min(keep,order.length-1)); }catch(e){ console.warn('atualização falhou', e); } }
async function boot(){
  let P; try{ P=await fetchPayload(); }catch(e){ document.getElementById('gerr').textContent='Não foi possível carregar os dados.'; return; }
  SKEY='dreamis_tv_k_'+P.s;
  try{ const r=localStorage.getItem(SKEY); if(r){ KEY=await crypto.subtle.importKey('raw',b64(r),'AES-GCM',true,['decrypt']); DATA=await decrypt(P,KEY); start(); return; } }catch(e){ try{localStorage.removeItem(SKEY);}catch(_){} }
  const hp=new URLSearchParams(location.hash.slice(1)).get('s');
  if(hp){ try{ KEY=await deriveKey(hp,P); DATA=await decrypt(P,KEY); try{history.replaceState(null,'',location.pathname+location.search);}catch(_){} start(); return; }catch(x){ document.getElementById('gerr').textContent='Link inválido.'; } }
  document.getElementById('gf').addEventListener('submit', async ev=>{
    ev.preventDefault(); const er=document.getElementById('gerr'); er.textContent='Abrindo…';
    try{ KEY=await deriveKey(document.getElementById('gp').value,P); DATA=await decrypt(P,KEY);
      if(document.getElementById('gr').checked){ const raw=new Uint8Array(await crypto.subtle.exportKey('raw',KEY)); try{localStorage.setItem(SKEY,btoa(String.fromCharCode(...raw)));}catch(_){} }
      start();
    }catch(x){ er.textContent='Senha incorreta.'; }
  });
}
boot();
</script>
